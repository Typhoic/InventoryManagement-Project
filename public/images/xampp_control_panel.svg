<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <style>
    .bg{fill:#f5f5f5}
    .panel{fill:#1f1f1f}
    .title{font:700 18px/1.2 "Manjari", sans-serif; fill:#fff}
    .box{fill:#fff;stroke:#e0e0e0}
    .label{font:500 13px/1.2 "Manjari", sans-serif; fill:#111}
    .btn{rx:6}
    .start{fill:#28a745}
    .btn-text{font:600 12px/1 "Manjari", sans-serif; fill:#fff}
  </style>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect x="12" y="12" width="776" height="48" class="panel" rx="6"/>
  <text x="28" y="44" class="title">XAMPP Control Panel (illustration)</text>

  <g transform="translate(24,80)">
    <rect width="740" height="136" class="box" rx="8"/>
    <text x="18" y="30" class="label">Apache</text>
    <rect x="460" y="12" width="84" height="34" rx="6" class="start"/>
    <text x="484" y="34" class="btn-text">Start</text>

    <text x="18" y="82" class="label">MySQL</text>
    <rect x="460" y="66" width="84" height="34" rx="6" class="start"/>
    <text x="484" y="88" class="btn-text">Start</text>

    <text x="18" y="124" class="label">MySQL Admin</text>
    <rect x="460" y="106" width="100" height="28" rx="6" fill="#007bff"/>
    <text x="490" y="125" class="btn-text">Admin</text>

    <text x="18" y="160" class="label" font-size="11px">Tip: Click the green "Start" buttons next to Apache and MySQL to run the services.</text>
  </g>
</svg>